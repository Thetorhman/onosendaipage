<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONO-SENDAI :: CYBERSPACE VII</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #00fff2;      /* cyan phosphor */
            --dim-color: #0090a0;
            --hot-color: #ff2079;       /* ice/alarm magenta */
            --grid-color: rgba(0, 255, 242, 0.35);
            --font-stack: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: var(--bg-color);
            height: 100%;
        }

        body {
            color: var(--text-color);
            font-family: var(--font-stack);
            font-size: 16px;
            line-height: 1.4;
            padding: 20px;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Perspective grid — the matrix stretching to a vanishing point */
        .gridplane {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            height: 55vh;
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(300px) rotateX(65deg);
            transform-origin: bottom;
            opacity: 0.85;
            filter: drop-shadow(0 0 6px rgba(0, 255, 242, 0.6));
            z-index: 0;
            pointer-events: none;
            animation: gridscroll 6s linear infinite;
        }

        @keyframes gridscroll {
            from { background-position: 0 0, 0 0; }
            to { background-position: 0 40px, 0 0; }
        }

        .voidglow {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 50% 30%, rgba(0,255,242,0.08), transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        /* CRT scanline / chromatic aberration flicker */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
                        linear-gradient(90deg, rgba(255, 0, 90, 0.04), rgba(0, 255, 242, 0.03), rgba(0, 40, 255, 0.04));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        body.alert::before {
            background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.35) 50%),
                        linear-gradient(90deg, rgba(255,32,121,0.10), rgba(255,32,121,0.03), rgba(255,32,121,0.10));
        }

        #terminal {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow-y: auto;
            padding-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .output-line {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 4px;
            text-shadow: 0 0 6px rgba(0, 255, 242, 0.7);
        }

        .output-line.hot {
            color: var(--hot-color);
            text-shadow: 0 0 8px rgba(255, 32, 121, 0.8);
        }

        .output-line.dim {
            color: var(--dim-color);
            text-shadow: none;
        }

        .input-line {
            display: flex;
            align-items: center;
            text-shadow: 0 0 6px rgba(0, 255, 242, 0.7);
        }

        .prompt {
            margin-right: 8px;
            flex-shrink: 0;
            color: var(--hot-color);
            text-shadow: 0 0 8px rgba(255, 32, 121, 0.8);
        }

        #cmd-input {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-family: var(--font-stack);
            font-size: 16px;
            outline: none;
            flex-grow: 1;
            text-shadow: 0 0 6px rgba(0, 255, 242, 0.7);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #144a4a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-color); }
    </style>
</head>
<body>

    <div class="voidglow"></div>
    <div class="gridplane"></div>

    <div id="terminal">
        <div id="log"></div>
        <div class="input-line">
            <span class="prompt"></span>
            <input type="text" id="cmd-input" autofocus autocomplete="off" spellcheck="false" disabled>
        </div>
    </div>

    <script>
        const logContainer = document.getElementById('log');
        const cmdInput = document.getElementById('cmd-input');
        const terminal = document.getElementById('terminal');
        const promptSpan = document.querySelector('.prompt');
        const body = document.body;

        let connectionState = 'offline';

        const bootText = [
            "ONO-SENDAI CYBERSPACE VII",
            "DECK ID: 7-ALPHA-SIERRA-994",
            "REGISTRY ......... onosendai.info",
            "NEURAL INTERFACE ................ OK",
            "TROJAN CACHE ..................... OK",
            "SIMSTIM BUFFER .................... OK",
            "JACKING IN..."
        ];

        function printLines(lines, cls) {
            lines.forEach(line => {
                const div = document.createElement('div');
                div.className = 'output-line' + (cls ? ' ' + cls : '');
                div.textContent = line;
                logContainer.appendChild(div);
            });
            terminal.scrollTop = terminal.scrollHeight;
        }

        function delayPrint(lines, delay, cls) {
            return new Promise(resolve => {
                setTimeout(() => {
                    printLines(lines, cls);
                    resolve();
                }, delay);
            });
        }

        function typeCommand(text, speed = 130) {
            return new Promise(resolve => {
                let i = 0;
                const interval = setInterval(() => {
                    cmdInput.value += text[i];
                    i++;
                    if (i >= text.length) {
                        clearInterval(interval);
                        setTimeout(() => {
                            printLines([cmdInput.value]);
                            cmdInput.value = '';
                            resolve();
                        }, 400);
                    }
                }, speed);
            });
        }

        window.addEventListener('load', async () => {
            printLines(bootText, 'dim');
            await new Promise(r => setTimeout(r, 1200));

            await typeCommand("JACK 7-ALPHA-SIERRA-994");
            connectionState = 'dialing';

            await delayPrint([
                "",
                "CARRIER ACQUIRED",
                "TRACING ROUTE THROUGH THE MATRIX...",
                ""
            ], 1400, 'dim');

            await delayPrint([
                "  hop 01 :: local node",
                "  hop 02 :: relay // FREESIDE-3",
                "  hop 03 :: relay // SPRAWL-BACKBONE",
                "  hop 04 :: relay // ZONE.ORB",
                ""
            ], 1300, 'dim');

            body.classList.add('alert');
            await delayPrint([
                "!! ICE DETECTED — BLACK ICE, COUNTERMEASURE ACTIVE",
                "   DEPLOYING TROJAN CACHE..."
            ], 900, 'hot');

            await delayPrint([
                "   ICE PENETRATED — COUNTERMEASURE BYPASSED"
            ], 1600, 'hot');
            body.classList.remove('alert');

            await delayPrint([
                "",
                "============================================",
                "        WELCOME TO THE CYBERSPACE MATRIX     ",
                "============================================",
                "A consensual hallucination. Bright lattices of logic.",
                "Deck registry & firmware: onosendai.info",
                ""
            ], 900);

            printLines(["OPERATOR SIGN-ON REQUIRED:"]);
            await new Promise(r => setTimeout(r, 600));

            await typeCommand("case");

            await delayPrint([
                "CONSTRUCT ACCEPTED.",
                "ACCESS GRANTED (LEVEL: COWBOY)",
                "",
                "Welcome back, CASE.",
                "The sky above the port is the color of a dead channel.",
                "",
                "Commands: LOOK, WHO, TRACE, ICE, RESUME, BYE",
                ""
            ], 1300);

            connectionState = 'matrix';
            promptSpan.textContent = 'MATRIX>';
            cmdInput.removeAttribute('disabled');
            cmdInput.focus();
        });

        document.addEventListener('click', () => {
            if (!cmdInput.hasAttribute('disabled')) {
                cmdInput.focus();
            }
        });

        cmdInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                const inputVal = this.value;
                const cleanInput = inputVal.trim();
                this.value = '';

                printLines([`MATRIX> ${cleanInput}`]);

                if (connectionState === 'matrix') {
                    handleMatrixCommands(cleanInput);
                }
            }
        });

        function printLink(label, href) {
            const div = document.createElement('div');
            div.className = 'output-line hot';
            const a = document.createElement('a');
            a.href = href;
            a.target = '_blank';
            a.rel = 'noopener';
            a.textContent = label;
            a.style.color = 'inherit';
            a.style.textDecoration = 'underline';
            div.appendChild(a);
            logContainer.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function handleMatrixCommands(input) {
            const command = input.trim().toLowerCase();

            if (command === 'bye' || command === 'exit' || command === 'flatline') {
                printLines([
                    "Jacking out...",
                    "CARRIER LOST",
                    "NO SIGNAL"
                ]);
                connectionState = 'offline';
                promptSpan.textContent = '';
                cmdInput.setAttribute('disabled', 'true');
            } else if (command === 'who') {
                printLines([
                    "Operators online:",
                    "  Case         (Ono-Sendai VII) *You*",
                    "  Armitage     (Relay // FREESIDE-3)",
                    "  Flatline     (Construct, read-only)",
                    "  Unknown_AI   (Signal masked)"
                ]);
            } else if (command === 'look') {
                printLines([
                    "Grids of light stretch to a vanishing point,",
                    "data towers glowing like distant city blocks.",
                    "Somewhere out past the edge, something is watching."
                ], 'dim');
            } else if (command === 'trace') {
                printLines([
                    "TRACE INITIATED...",
                    "Route obscured. Signal bouncing through masked relays."
                ], 'dim');
            } else if (command === 'ice') {
                body.classList.add('alert');
                printLines([
                    "SCANNING FOR COUNTERMEASURES...",
                    "Black ICE detected nearby. Recommend caution."
                ], 'hot');
                setTimeout(() => body.classList.remove('alert'), 2000);
            } else if (command === 'resume' || command === 'cv') {
                printLines([
                    "LOCATING CONSTRUCT...",
                    "PATH :: resume.html",
                    "DECRYPTING ... OK"
                ], 'dim');
                printLink("[ OPEN RESUME ]  ->  resume.html", "resume.html");
                printLines(["", "> opening resume construct in a new window", ""], 'dim');
                window.open('resume.html', '_blank', 'noopener');
            } else if (command !== '') {
                printLines([`MATRIX: unrecognized construct '${input}'`], 'dim');
            }
        }
    </script>
</body>
</html>
